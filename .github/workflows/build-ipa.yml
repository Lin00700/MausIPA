name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project MausIPA.xcodeproj \
            -scheme MausIPA \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MausIPA.app Payload/
          zip -qry MausIPA-unsigned.ipa Payload
          ls -lh MausIPA-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MausIPA-unsigned-ipa
          path: MausIPA-unsigned.ipa
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MausIPA build ${{ github.run_number }}
          body: |
            自动构建的未签名 MausIPA IPA。
            用 TrollStore / AltStore / SideStore / Sideloadly 自签安装。
          files: MausIPA-unsigned.ipa
